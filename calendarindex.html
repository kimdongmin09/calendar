<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통역 일정 관리 시스템 (Interpreter Schedule Manager)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md flex items-center justify-center">
                        <i data-lucide="languages" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 leading-tight">통역 일정 관리자</h1>
                        <p class="text-xs text-slate-500 hidden sm:block">Professional Interpretation Schedule Manager</p>
                    </div>
                </div>

                <!-- Actions / Controls -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <button id="btn-export" title="데이터 백업하기" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors flex items-center space-x-1 text-sm font-medium">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span class="hidden md:inline">백업(내보내기)</span>
                    </button>
                    <label id="btn-import-label" title="데이터 복구하기" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors flex items-center space-x-1 text-sm font-medium cursor-pointer">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span class="hidden md:inline">복구(불러오기)</span>
                        <input type="file" id="file-import" accept=".json" class="hidden" />
                    </label>
                    <div class="h-6 w-px bg-slate-200 my-auto"></div>
                    <button id="btn-add-event" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all flex items-center space-x-1.5 hover:shadow">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>일정 등록</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Summary Stats Dashboard -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Card 1: Total Monthly Events -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">이번 달 총 일정</p>
                    <h3 id="stat-total-count" class="text-2xl font-bold text-slate-900 mt-1">0 건</h3>
                </div>
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
                    <i data-lucide="calendar-check-2" class="w-6 h-6"></i>
                </div>
            </div>

            <!-- Card 2: Expected Revenue -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">이번 달 예상 총 수입</p>
                    <h3 id="stat-total-revenue" class="text-2xl font-bold text-slate-900 mt-1">0 원</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                </div>
            </div>

            <!-- Card 3: Pending Payments -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">입금 대기중 금액</p>
                    <h3 id="stat-pending-revenue" class="text-2xl font-bold text-amber-600 mt-1">0 원</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl">
                    <i data-lucide="clock-4" class="w-6 h-6"></i>
                </div>
            </div>

            <!-- Card 4: Interpretation Types Ratio/Count -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">이번 달 총 통역 시간</p>
                    <h3 id="stat-total-hours" class="text-2xl font-bold text-slate-900 mt-1">0 시간</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                    <i data-lucide="timer" class="w-6 h-6"></i>
                </div>
            </div>
        </section>

        <!-- Controls Toolbar: Views + Navigation + Filters -->
        <section class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col lg:flex-row gap-4 items-center justify-between">
            <!-- Navigation (Prev, Next, Today & Current Range Title) -->
            <div class="flex items-center space-x-3 w-full lg:w-auto justify-between lg:justify-start">
                <div class="flex items-center space-x-1">
                    <button id="btn-prev" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button id="btn-today" class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                        오늘
                    </button>
                    <button id="btn-next" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
                <h2 id="calendar-title" class="text-lg font-bold text-slate-900">2026년 10월</h2>
            </div>

            <!-- Views Selector & Filters -->
            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-end">
                <!-- Filters -->
                <div class="flex items-center space-x-2 text-xs">
                    <select id="filter-type" class="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">모든 통역 종류</option>
                        <option value="동시통역">동시통역</option>
                        <option value="순차통역">순차통역</option>
                        <option value="위스퍼링">위스퍼링</option>
                        <option value="수행통역">수행통역</option>
                        <option value="기타">기타</option>
                    </select>

                    <select id="filter-status" class="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">모든 정산 상태</option>
                        <option value="대기">입금 대기</option>
                        <option value="완료">입금 완료</option>
                    </select>
                </div>

                <!-- View Switcher Tabs -->
                <div class="bg-slate-100 p-1 rounded-xl flex space-x-1">
                    <button data-view="month" class="view-btn px-3 py-1.5 text-xs font-semibold rounded-lg transition-all bg-white text-indigo-600 shadow-sm">
                        월간
                    </button>
                    <button data-view="week" class="view-btn px-3 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900">
                        주간
                    </button>
                    <button data-view="day" class="view-btn px-3 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900">
                        일간
                    </button>
                </div>
            </div>
        </section>

        <!-- Calendar Display Container -->
        <section id="calendar-container" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden min-h-[600px] flex flex-col">
            <!-- Calendar View Content (Dynamically rendered via JS) -->
            <div id="calendar-view-content" class="flex-1"></div>
        </section>

    </main>

    <!-- Modal: Add / Edit Event -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="text-base font-bold text-slate-900 flex items-center space-x-2">
                    <i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-600"></i>
                    <span>통역 일정 등록</span>
                </h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Form Body -->
            <form id="event-form" class="p-6 overflow-y-auto space-y-4 text-sm flex-1">
                <input type="hidden" id="event-id">

                <!-- Title / Client Name -->
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">통역건명 / 고객사 <span class="text-red-500">*</span></label>
                    <input type="text" id="event-title" required placeholder="예: [글로벌 AI 컨퍼런스] - ABC 테크"
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Interpretation Type & Language Pair -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">통역 종류 <span class="text-red-500">*</span></label>
                        <select id="event-type" required class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="동시통역">동시통역</option>
                            <option value="순차통역">순차통역</option>
                            <option value="위스퍼링">위스퍼링</option>
                            <option value="수행통역">수행통역</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">언어쌍 (Language Pair)</label>
                        <input type="text" id="event-languages" placeholder="예: 한국어 ↔ 영어, 한-일"
                            class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Date & Time Range -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-3.5 rounded-xl border border-slate-200/60">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">시작 일시 <span class="text-red-500">*</span></label>
                        <input type="datetime-local" id="event-start" required
                            class="w-full border border-slate-200 rounded-xl px-3 py-1.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">종료 일시 <span class="text-red-500">*</span></label>
                        <input type="datetime-local" id="event-end" required
                            class="w-full border border-slate-200 rounded-xl px-3 py-1.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    </div>
                </div>

                <!-- Location / Online Link -->
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">장소 또는 온라인 링크</label>
                    <div class="relative">
                        <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                        <input type="text" id="event-location" placeholder="예: 코엑스 오디토리움 또는 Zoom/Teams 링크"
                            class="w-full border border-slate-200 rounded-xl pl-9 pr-3.5 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Fee / Rate Status & Color Badge Choice -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">통역료 (원)</label>
                        <input type="number" id="event-fee" min="0" step="10000" placeholder="예: 800000"
                            class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">입금/정산 상태</label>
                        <select id="event-status" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="대기">입금 대기</option>
                            <option value="완료">입금 완료</option>
                        </select>
                    </div>
                </div>

                <!-- Color Code Picker -->
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">구분 색상</label>
                    <div class="flex items-center space-x-3" id="color-picker-group">
                        <!-- Radio buttons for color selection -->
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="indigo" checked class="peer sr-only">
                            <span class="w-7 h-7 rounded-full bg-indigo-500 inline-block ring-2 ring-offset-2 ring-transparent peer-checked:ring-indigo-600 transition-all"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="emerald" class="peer sr-only">
                            <span class="w-7 h-7 rounded-full bg-emerald-500 inline-block ring-2 ring-offset-2 ring-transparent peer-checked:ring-emerald-600 transition-all"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="amber" class="peer sr-only">
                            <span class="w-7 h-7 rounded-full bg-amber-500 inline-block ring-2 ring-offset-2 ring-transparent peer-checked:ring-amber-600 transition-all"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="rose" class="peer sr-only">
                            <span class="w-7 h-7 rounded-full bg-rose-500 inline-block ring-2 ring-offset-2 ring-transparent peer-checked:ring-rose-600 transition-all"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="sky" class="peer sr-only">
                            <span class="w-7 h-7 rounded-full bg-sky-500 inline-block ring-2 ring-offset-2 ring-transparent peer-checked:ring-sky-600 transition-all"></span>
                        </label>
                    </div>
                </div>

                <!-- Preparation Notes / Material Links -->
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">사전 자료 메모 / 기타 안내사항</label>
                    <textarea id="event-notes" rows="3" placeholder="예: 발표자료 받음, 용어집 사전 숙지 필요, 10분 전 사전 음성 테스트 진행"
                        class="w-full border border-slate-200 rounded-xl p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <!-- Footer / Action Buttons -->
                <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                    <button type="button" id="btn-delete-event" class="text-rose-600 hover:bg-rose-50 px-3 py-2 rounded-xl text-sm font-semibold transition-colors flex items-center space-x-1 hidden">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span>삭제</span>
                    </button>
                    <div class="flex items-center space-x-2 ml-auto">
                        <button type="button" id="btn-cancel-modal" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 rounded-xl text-slate-600 text-sm font-semibold transition-colors">
                            취소
                        </button>
                        <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-colors">
                            저장하기
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50">
        <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message" class="text-sm font-medium">성공적으로 저장되었습니다.</span>
    </div>

    <!-- Script Section -->
    <script>
        // --- State Management ---
        let currentDate = new Date(); // Currently navigated date
        let currentView = 'month';    // 'month', 'week', 'day'
        let events = [];              // All interpretation events list

        // Color Schema Maps for UI badges
        const colorMap = {
            indigo: { bg: 'bg-indigo-500', lightBg: 'bg-indigo-50 text-indigo-700 border-indigo-200', text: 'text-indigo-600' },
            emerald: { bg: 'bg-emerald-500', lightBg: 'bg-emerald-50 text-emerald-700 border-emerald-200', text: 'text-emerald-600' },
            amber: { bg: 'bg-amber-500', lightBg: 'bg-amber-50 text-amber-700 border-amber-200', text: 'text-amber-600' },
            rose: { bg: 'bg-rose-500', lightBg: 'bg-rose-50 text-rose-700 border-rose-200', text: 'text-rose-600' },
            sky: { bg: 'bg-sky-500', lightBg: 'bg-sky-50 text-sky-700 border-sky-200', text: 'text-sky-600' }
        };

        // Sample initial demo data
        const sampleEvents = [
            {
                id: '1',
                title: '[글로벌 AI 컨퍼런스] 기조연설 및 세션',
                type: '동시통역',
                languages: '한국어 ↔ 영어',
                start: formatDateForInput(new Date(new Date().getFullYear(), new Date().getMonth(), 12, 09, 00)),
                end: formatDateForInput(new Date(new Date().getFullYear(), new Date().getMonth(), 12, 17, 00)),
                location: '코엑스 그랜드볼룸 / Zoom 연동',
                fee: 900000,
                status: '완료',
                color: 'indigo',
                notes: '기조연설 발표자 연설문 미리 전달 받음. 용어집 정리 완료.'
            },
            {
                id: '2',
                title: '한-일 IT 기업 비즈니스 미팅',
                type: '순차통역',
                languages: '한국어 ↔ 일본어',
                start: formatDateForInput(new Date(new Date().getFullYear(), new Date().getMonth(), 18, 14, 00)),
                end: formatDateForInput(new Date(new Date().getFullYear(), new Date().getMonth(), 18, 17, 00)),
                location: '강남 파이낸스 센터 15층 회의실',
                fee: 500000,
                status: '대기',
                color: 'emerald',
                notes: '클라우드 솔루션 계약 조건 관련 논의.'
            },
            {
                id: '3',
                title: '해외 VIP VIP 수행 및 오찬',
                type: '수행통역',
                languages: '한국어 ↔ 영어',
                start: formatDateForInput(new Date(new Date().getFullYear(), new Date().getMonth(), 22, 11, 30)),
                end: formatDateForInput(new Date(new Date().getFullYear(), new Date().getMonth(), 22, 15, 00)),
                location: '신라호텔',
                fee: 450000,
                status: '대기',
                color: 'amber',
                notes: '이동 동선 및 식사 예절 확인 필요.'
            }
        ];

        // Utility: Date formatter helper
        function formatDateForInput(date) {
            const pad = (n) => (n < 10 ? '0' + n : n);
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            loadEventsFromStorage();
            initLucideIcons();
            setupEventListeners();
            renderCalendar();
            updateDashboardStats();
        });

        function initLucideIcons() {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // --- Storage Logic ---
        function loadEventsFromStorage() {
            const stored = localStorage.getItem('interpreter_events');
            if (stored) {
                try {
                    events = JSON.parse(stored);
                } catch (e) {
                    events = [...sampleEvents];
                }
            } else {
                events = [...sampleEvents];
                saveEventsToStorage();
            }
        }

        function saveEventsToStorage() {
            localStorage.setItem('interpreter_events', JSON.stringify(events));
            updateDashboardStats();
        }

        // --- Dashboard Calculations ---
        function updateDashboardStats() {
            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();

            // Filter events in current month
            const monthEvents = events.filter(e => {
                const startDate = new Date(e.start);
                return startDate.getFullYear() === currentYear && startDate.getMonth() === currentMonth;
            });

            // 1. Total Count
            document.getElementById('stat-total-count').textContent = `${monthEvents.length} 건`;

            // 2. Total Expected Revenue
            const totalRevenue = monthEvents.reduce((acc, curr) => acc + (Number(curr.fee) || 0), 0);
            document.getElementById('stat-total-revenue').textContent = `${totalRevenue.toLocaleString()} 원`;

            // 3. Pending Payment Revenue
            const pendingRevenue = monthEvents
                .filter(e => e.status === '대기')
                .reduce((acc, curr) => acc + (Number(curr.fee) || 0), 0);
            document.getElementById('stat-pending-revenue').textContent = `${pendingRevenue.toLocaleString()} 원`;

            // 4. Total Interpreting Hours
            let totalHours = 0;
            monthEvents.forEach(e => {
                const start = new Date(e.start);
                const end = new Date(e.end);
                const diffMs = end - start;
                if (diffMs > 0) {
                    totalHours += diffMs / (1000 * 60 * 60);
                }
            });
            document.getElementById('stat-total-hours').textContent = `${totalHours.toFixed(1)} 시간`;
        }

        // --- Event Listeners Setup ---
        function setupEventListeners() {
            // View switcher
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.view-btn').forEach(b => {
                        b.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                        b.classList.add('text-slate-600');
                    });
                    const target = e.currentTarget;
                    target.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                    target.classList.remove('text-slate-600');

                    currentView = target.dataset.view;
                    renderCalendar();
                });
            });

            // Navigation
            document.getElementById('btn-prev').addEventListener('click', () => navigateDate(-1));
            document.getElementById('btn-next').addEventListener('click', () => navigateDate(1));
            document.getElementById('btn-today').addEventListener('click', () => {
                currentDate = new Date();
                renderCalendar();
            });

            // Filter changes
            document.getElementById('filter-type').addEventListener('change', renderCalendar);
            document.getElementById('filter-status').addEventListener('change', renderCalendar);

            // Modal Trigger
            document.getElementById('btn-add-event').addEventListener('click', () => openModal());
            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

            // Form Submit
            document.getElementById('event-form').addEventListener('submit', handleFormSubmit);
            document.getElementById('btn-delete-event').addEventListener('click', handleDeleteEvent);

            // Import / Export
            document.getElementById('btn-export').addEventListener('click', exportData);
            document.getElementById('file-import').addEventListener('change', importData);
        }

        function navigateDate(direction) {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + direction);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (direction * 7));
            } else if (currentView === 'day') {
                currentDate.setDate(currentDate.getDate() + direction);
            }
            renderCalendar();
        }

        // --- Filtering Helper ---
        function getFilteredEvents() {
            const typeFilter = document.getElementById('filter-type').value;
            const statusFilter = document.getElementById('filter-status').value;

            return events.filter(e => {
                const matchType = (typeFilter === 'ALL') || (e.type === typeFilter);
                const matchStatus = (statusFilter === 'ALL') || (e.status === statusFilter);
                return matchType && matchStatus;
            });
        }

        // --- Render Main Router ---
        function renderCalendar() {
            const container = document.getElementById('calendar-view-content');
            container.innerHTML = '';

            // Update Header Title Range
            updateCalendarTitle();

            if (currentView === 'month') {
                renderMonthView(container);
            } else if (currentView === 'week') {
                renderWeekView(container);
            } else if (currentView === 'day') {
                renderDayView(container);
            }

            initLucideIcons();
            updateDashboardStats();
        }

        function updateCalendarTitle() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const date = currentDate.getDate();

            if (currentView === 'month') {
                document.getElementById('calendar-title').textContent = `${year}년 ${month}월`;
            } else if (currentView === 'week') {
                const weekStart = getStartOfWeek(currentDate);
                const weekEnd = new Date(weekStart);
                weekEnd.setDate(weekEnd.getDate() + 6);
                document.getElementById('calendar-title').textContent = 
                    `${weekStart.getFullYear()}년 ${weekStart.getMonth() + 1}월 ${weekStart.getDate()}일 - ${weekEnd.getMonth() + 1}월 ${weekEnd.getDate()}일`;
            } else {
                const dayName = ['일', '월', '화', '수', '목', '금', '토'][currentDate.getDay()];
                document.getElementById('calendar-title').textContent = `${year}년 ${month}월 ${date}일 (${dayName})`;
            }
        }

        function getStartOfWeek(d) {
            const date = new Date(d);
            const day = date.getDay(); // 0: Sun
            const diff = date.getDate() - day;
            return new Date(date.setDate(diff));
        }

        // --- 1. Month View Rendering ---
        function renderMonthView(container) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const activeEvents = getFilteredEvents();

            let html = `
                <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50/70 text-center font-semibold text-xs text-slate-600 py-2.5">
                    <span class="text-rose-500">일</span>
                    <span>월</span>
                    <span>화</span>
                    <span>수</span>
                    <span>목</span>
                    <span>금</span>
                    <span class="text-blue-500">토</span>
                </div>
                <div class="grid grid-cols-7 auto-rows-fr flex-1 border-slate-200 divide-x divide-y divide-slate-100">
            `;

            // Empty cells for padding before start of month
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="bg-slate-50/30 min-h-[110px] p-1.5"></div>`;
            }

            // Days of the month
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const cellDate = new Date(year, month, day);
                const isToday = cellDate.toDateString() === today.toDateString();

                // Find events for this day
                const dayEvents = activeEvents.filter(e => {
                    const eStart = new Date(e.start);
                    return eStart.getFullYear() === year && eStart.getMonth() === month && eStart.getDate() === day;
                });

                html += `
                    <div class="min-h-[110px] p-1.5 transition-colors hover:bg-slate-50/60 flex flex-col group cursor-pointer" onclick="handleCellClick('${cellDate.toISOString()}')">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-semibold px-1.5 py-0.5 rounded-full ${isToday ? 'bg-indigo-600 text-white font-bold' : 'text-slate-700'}">
                                ${day}
                            </span>
                            ${dayEvents.length > 0 ? `<span class="text-[10px] font-bold text-slate-400 group-hover:text-indigo-600">${dayEvents.length}건</span>` : ''}
                        </div>
                        <div class="space-y-1 overflow-y-auto max-h-[85px] flex-1">
                `;

                dayEvents.forEach(e => {
                    const c = colorMap[e.color] || colorMap.indigo;
                    const startTime = e.start.split('T')[1]?.substring(0, 5) || '';
                    html += `
                        <div onclick="event.stopPropagation(); editEvent('${e.id}')" 
                             class="${c.lightBg} border text-[11px] px-2 py-1 rounded-lg truncate cursor-pointer hover:shadow-sm transition-all flex items-center justify-between">
                            <span class="font-medium truncate">${e.title}</span>
                            <span class="text-[9px] opacity-75 ml-1 shrink-0">${startTime}</span>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // --- 2. Week View Rendering ---
        function renderWeekView(container) {
            const startOfWeek = getStartOfWeek(currentDate);
            const activeEvents = getFilteredEvents();
            const days = [];

            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                days.push(d);
            }

            const today = new Date();

            let html = `
                <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50/70 text-center text-xs font-semibold text-slate-600 py-3">
            `;

            days.forEach((d, idx) => {
                const isToday = d.toDateString() === today.toDateString();
                const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                const colorClass = idx === 0 ? 'text-rose-500' : idx === 6 ? 'text-blue-500' : 'text-slate-700';

                html += `
                    <div class="${colorClass}">
                        <span>${dayNames[idx]}</span>
                        <div class="mt-0.5 inline-block px-2 py-0.5 rounded-full ${isToday ? 'bg-indigo-600 text-white font-bold' : ''}">
                            ${d.getDate()}
                        </div>
                    </div>
                `;
            });

            html += `</div><div class="grid grid-cols-7 divide-x divide-slate-100 flex-1 min-h-[500px]">`;

            days.forEach(d => {
                const dayEvents = activeEvents.filter(e => {
                    const eStart = new Date(e.start);
                    return eStart.toDateString() === d.toDateString();
                });

                html += `
                    <div class="p-2 space-y-2 hover:bg-slate-50/40 transition-colors" onclick="handleCellClick('${d.toISOString()}')">
                `;

                dayEvents.forEach(e => {
                    const c = colorMap[e.color] || colorMap.indigo;
                    const startTime = e.start.split('T')[1]?.substring(0, 5) || '';
                    const endTime = e.end.split('T')[1]?.substring(0, 5) || '';

                    html += `
                        <div onclick="event.stopPropagation(); editEvent('${e.id}')" 
                             class="${c.lightBg} border p-2 rounded-xl text-xs space-y-1 hover:shadow-md transition-all cursor-pointer">
                            <div class="font-bold truncate text-slate-900">${e.title}</div>
                            <div class="text-[10px] flex items-center justify-between text-slate-600">
                                <span>${startTime} - ${endTime}</span>
                                <span class="px-1.5 py-0.5 bg-white/70 rounded border text-[9px] font-semibold">${e.type}</span>
                            </div>
                            ${e.location ? `<div class="text-[10px] text-slate-500 truncate"><i data-lucide="map-pin" class="w-3 h-3 inline mr-0.5"></i>${e.location}</div>` : ''}
                        </div>
                    `;
                });

                html += `</div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // --- 3. Day View Rendering ---
        function renderDayView(container) {
            const activeEvents = getFilteredEvents();
            const dayEvents = activeEvents.filter(e => {
                const eStart = new Date(e.start);
                return eStart.toDateString() === currentDate.toDateString();
            });

            // Sort events by start time
            dayEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

            let html = `
                <div class="p-6 max-w-4xl mx-auto w-full space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                        <h3 class="text-base font-bold text-slate-800">
                            총 ${dayEvents.length}개 통역 일정
                        </h3>
                        <button onclick="openModalWithDate('${currentDate.toISOString()}')" class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition-colors flex items-center space-x-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                            <span>이 날짜에 일정 추가</span>
                        </button>
                    </div>
            `;

            if (dayEvents.length === 0) {
                html += `
                    <div class="text-center py-16 text-slate-400 space-y-3">
                        <i data-lucide="calendar-x2" class="w-12 h-12 mx-auto stroke-1 text-slate-300"></i>
                        <p class="text-sm">등록된 통역 일정이 없습니다.</p>
                    </div>
                `;
            } else {
                html += `<div class="space-y-3">`;
                dayEvents.forEach(e => {
                    const c = colorMap[e.color] || colorMap.indigo;
                    const startTime = e.start.split('T')[1]?.substring(0, 5) || '';
                    const endTime = e.end.split('T')[1]?.substring(0, 5) || '';

                    html += `
                        <div onclick="editEvent('${e.id}')" class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col md:flex-row md:items-center justify-between gap-4 border-l-4 ${c.bg.replace('bg-', 'border-l-')} hover:border-indigo-500">
                            <div class="space-y-1.5 flex-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${c.lightBg}">${e.type}</span>
                                    ${e.languages ? `<span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">${e.languages}</span>` : ''}
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${e.status === '완료' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                        정산: ${e.status}
                                    </span>
                                </div>
                                <h4 class="text-base font-bold text-slate-900">${e.title}</h4>
                                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500">
                                    <span class="flex items-center"><i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i>${startTime} ~ ${endTime}</span>
                                    ${e.location ? `<span class="flex items-center"><i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1"></i>${e.location}</span>` : ''}
                                </div>
                                ${e.notes ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg mt-2 border border-slate-100"><span class="font-semibold">메모:</span> ${e.notes}</p>` : ''}
                            </div>
                            <div class="text-right md:border-l md:border-slate-100 md:pl-4 flex md:flex-col justify-between items-end">
                                <span class="text-xs text-slate-400">통역료</span>
                                <span class="text-lg font-bold text-slate-900">${e.fee ? Number(e.fee).toLocaleString() + '원' : '미정'}</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // --- Form Modal Actions ---
        function handleCellClick(isoDateStr) {
            openModalWithDate(isoDateStr);
        }

        function openModalWithDate(isoDateStr) {
            const date = new Date(isoDateStr);
            // Default time set to 09:00 - 17:00
            date.setHours(9, 0, 0, 0);
            const startStr = formatDateForInput(date);
            date.setHours(17, 0, 0, 0);
            const endStr = formatDateForInput(date);

            openModal({ start: startStr, end: endStr });
        }

        function openModal(data = {}) {
            const modal = document.getElementById('event-modal');
            const form = document.getElementById('event-form');
            form.reset();

            document.getElementById('event-id').value = data.id || '';
            document.getElementById('event-title').value = data.title || '';
            document.getElementById('event-type').value = data.type || '동시통역';
            document.getElementById('event-languages').value = data.languages || '';
            document.getElementById('event-start').value = data.start || formatDateForInput(new Date());
            document.getElementById('event-end').value = data.end || formatDateForInput(new Date(Date.now() + 3600000));
            document.getElementById('event-location').value = data.location || '';
            document.getElementById('event-fee').value = data.fee || '';
            document.getElementById('event-status').value = data.status || '대기';
            document.getElementById('event-notes').value = data.notes || '';

            // Color selection
            const color = data.color || 'indigo';
            const colorRadio = form.querySelector(`input[name="event-color"][value="${color}"]`);
            if (colorRadio) colorRadio.checked = true;

            // UI changes for Edit vs Create
            const deleteBtn = document.getElementById('btn-delete-event');
            const modalTitle = document.getElementById('modal-title');

            if (data.id) {
                deleteBtn.classList.remove('hidden');
                modalTitle.querySelector('span').textContent = '통역 일정 수정';
            } else {
                deleteBtn.classList.add('hidden');
                modalTitle.querySelector('span').textContent = '통역 일정 등록';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('event-modal').classList.add('hidden');
        }

        function editEvent(id) {
            const event = events.find(e => e.id === id);
            if (event) {
                openModal(event);
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('event-id').value;
            const title = document.getElementById('event-title').value;
            const type = document.getElementById('event-type').value;
            const languages = document.getElementById('event-languages').value;
            const start = document.getElementById('event-start').value;
            const end = document.getElementById('event-end').value;
            const location = document.getElementById('event-location').value;
            const fee = document.getElementById('event-fee').value;
            const status = document.getElementById('event-status').value;
            const notes = document.getElementById('event-notes').value;

            const selectedColorRadio = document.querySelector('input[name="event-color"]:checked');
            const color = selectedColorRadio ? selectedColorRadio.value : 'indigo';

            if (id) {
                // Edit existing
                const index = events.findIndex(item => item.id === id);
                if (index !== -1) {
                    events[index] = { id, title, type, languages, start, end, location, fee, status, notes, color };
                    showToast('일정이 성공적으로 수정되었습니다.');
                }
            } else {
                // New event
                const newEvent = {
                    id: Date.now().toString(),
                    title, type, languages, start, end, location, fee, status, notes, color
                };
                events.push(newEvent);
                showToast('새 통역 일정이 등록되었습니다.');
            }

            saveEventsToStorage();
            closeModal();
            renderCalendar();
        }

        function handleDeleteEvent() {
            const id = document.getElementById('event-id').value;
            if (!id) return;

            if (confirm('이 통역 일정을 삭제하시겠습니까?')) {
                events = events.filter(e => e.id !== id);
                saveEventsToStorage();
                closeModal();
                renderCalendar();
                showToast('일정이 삭제되었습니다.');
            }
        }

        // --- Backup & Restore (JSON Export/Import) ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(events, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `통역일정_백업_${new Date().toISOString().slice(0, 10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('백업 파일이 다운로드 되었습니다.');
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        events = imported;
                        saveEventsToStorage();
                        renderCalendar();
                        showToast('성공적으로 일정을 불러왔습니다.');
                    } else {
                        alert('올바른 백업 파일 형식이 아닙니다.');
                    }
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        // --- Toast Notification ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
